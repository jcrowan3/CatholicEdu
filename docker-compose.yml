services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: catechist
      POSTGRES_USER: catechist
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catechist -d catechist"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: "postgresql+asyncpg://catechist:devpassword@db:5432/catechist"
      JWT_SECRET: "dev-secret-change-in-production"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5175"]'
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
    command: uv run uvicorn catechist_api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
