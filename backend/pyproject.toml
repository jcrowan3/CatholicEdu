[project]
name = "catechist-api"
version = "0.1.0"
description = "FastAPI backend for Catholic Catechist Toolkit"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "alembic>=1.19.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15",
    "pyjwt>=2.13",
    "bcrypt>=5.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28",
    "email-validator>=2.3",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catechist_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
# SQLAlchemy's async bridge executes database work in greenlets. Python 3.12's
# tracer needs this declared explicitly or exercised service lines go uncounted.
concurrency = ["greenlet"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
# FastAPI intentionally declares dependencies by calling Depends in defaults.
ignore = ["B008"]
