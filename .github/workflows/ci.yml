name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run audit:content
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12 --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest --cov=catechist_api --cov-report=term --cov-fail-under=95
      - run: uv run pip-audit --local

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the Docker Compose stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Smoke-test the API and frontend containers
        run: |
          curl --fail --show-error http://127.0.0.1:8000/api/v1/health
          curl --fail --show-error http://127.0.0.1:5173/
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop the Docker Compose stack
        if: always()
        run: docker compose down --volumes
